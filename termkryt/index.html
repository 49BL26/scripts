/* ============================================================
   WORD INPUT ASSISTANT
   Each row of WORD_PAIRS in wordpairs.js = the two words printed on ONE card.
   Placing either word blocks BOTH from further suggestions.
   ============================================================ */

const ASSIST_MAX = 10;

/* ---- index build ---- */
const wnorm = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
const WORD_POOL = [];                 // normalised keys, deduped
const WORD_DISPLAY = new Map();       // key -> display form
const WORD_PARTNERS = new Map();      // key -> Set(partner keys)

(function buildWordIndex() {
    WORD_PAIRS.forEach(pair => pair.forEach(w => {
        const k = wnorm(w);
        if (!k) return;
        if (!WORD_PARTNERS.has(k)) {
            WORD_PARTNERS.set(k, new Set());
            WORD_DISPLAY.set(k, w);
            WORD_POOL.push(k);
        }
        pair.forEach(o => {
            const ok = wnorm(o);
            if (ok && ok !== k) WORD_PARTNERS.get(k).add(ok);
        });
    }));
})();

/* ---- what is already spoken for ---- */
function assistBlockedKeys(ignoreIndex) {
    const blocked = new Set();
    document.querySelectorAll('#board .cell').forEach((cell, i) => {
        if (i === ignoreIndex) return;                       // the cell being edited
        const t = (cell.querySelector('.cell-text').textContent || '').trim();
        if (!t || t === 'Card ' + (i + 1)) return;           // placeholder = empty
        const k = wnorm(t);
        if (!k) return;
        blocked.add(k);
        (WORD_PARTNERS.get(k) || []).forEach(p => blocked.add(p));
    });
    return blocked;
}

/* ---- ranking: prefix > substring > fuzzy subsequence ---- */
function assistScore(key, q) {
    const p = key.indexOf(q);
    if (p === 0) return 1000 - key.length;
    if (p > 0)   return 700 - p * 10 - key.length;
    let qi = 0, last = -1, spread = 0;
    for (let i = 0; i < key.length && qi < q.length; i++) {
        if (key[i] === q[qi]) {
            if (last >= 0) spread += i - last - 1;
            last = i; qi++;
        }
    }
    if (qi < q.length) return -1;
    return 400 - spread * 4 - key.length;
}

function assistSuggest(query, ignoreIndex) {
    const q = wnorm(query);
    if (!q) return [];
    const blocked = assistBlockedKeys(ignoreIndex);
    return WORD_POOL
        .filter(k => !blocked.has(k))
        .map(k => ({ key: k, score: assistScore(k, q) }))
        .filter(o => o.score > 0)
        .sort((a, b) => b.score - a.score ||
              WORD_DISPLAY.get(a.key).localeCompare(WORD_DISPLAY.get(b.key)))
        .slice(0, ASSIST_MAX);
}

/* ---- UI ---- */
const assist = { box:null, input:null, items:[], active:-1, ignoreIndex:-1, on:false, autoApply:false, mode:'replace' };
const assistEsc = s => String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function assistInit() {
    const input = document.getElementById('modal-input');
    if (!input) return;
    const box = document.createElement('div');
    box.className = 'assist-list';
    input.insertAdjacentElement('afterend', box);
    assist.input = input;
    assist.box = box;

    input.addEventListener('input',   () => { if (assist.on) assistRefresh(); });
    input.addEventListener('keydown', assistKeydown);
    input.addEventListener('blur',    () => setTimeout(assistClose, 120));
    box.addEventListener('mousedown', e => {
        const row = e.target.closest('.assist-item');
        if (!row) return;
        e.preventDefault();                                  // keep focus in the field
        assistApply(+row.dataset.i);
    });
}

function assistOn(ignoreIndex = -1, mode = 'replace') {
    assist.on = true;
    assist.ignoreIndex = ignoreIndex;
    assist.mode = mode;
}
function assistOff() { assist.on = false; assist.ignoreIndex = -1; assistClose(); }
function assistClose() {
    assist.items = []; assist.active = -1;
    if (assist.box) { assist.box.classList.remove('open'); assist.box.innerHTML = ''; }
}

function assistQueryFromInput() {
    const raw = assist.input.value || '';
    if (assist.mode === 'append') {
        const idx = raw.lastIndexOf(',');
        return raw.slice(idx + 1);      // text after the last comma
    }
    return raw;
}

function assistRefresh() {
    const q = assistQueryFromInput().trim();
    if (!q) { assistClose(); return; }
    assist.items = assistSuggest(q, assist.ignoreIndex);
    assist.active = assist.items.length ? 0 : -1;
    assistRender(wnorm(q));
}

function assistRender(q) {
    const box = assist.box;
    if (!assist.items.length) {
        box.innerHTML = '<div class="assist-empty">no free card matches</div>';
        box.classList.add('open');
        return;
    }
    box.innerHTML = assist.items.map((it, i) => {
        const disp = WORD_DISPLAY.get(it.key);
        const partners = [...(WORD_PARTNERS.get(it.key) || [])]
            .map(p => WORD_DISPLAY.get(p)).join(', ');
        return `<div class="assist-item${i === assist.active ? ' active' : ''}" data-i="${i}">`
             + `<span>${assistMark(disp, q)}</span>`
             + (partners ? `<span class="pair">pairs with ${assistEsc(partners)}</span>` : '')
             + `</div>`;
    }).join('');
    box.classList.add('open');
    const act = box.querySelector('.assist-item.active');
    if (act) act.scrollIntoView({ block: 'nearest' });
}

function assistMark(display, q) {
    const i = display.toLowerCase().indexOf(q);
    if (i < 0) return assistEsc(display);
    return assistEsc(display.slice(0, i))
         + '<b>' + assistEsc(display.slice(i, i + q.length)) + '</b>'
         + assistEsc(display.slice(i + q.length));
}

function assistKeydown(e) {
    if (!assist.on) return;
    const open = assist.box && assist.box.classList.contains('open') && assist.items.length > 0;

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (open) {
            e.preventDefault();
            const step = e.key === 'ArrowDown' ? 1 : -1;
            assist.active = (assist.active + step + assist.items.length) % assist.items.length;
            assistRender(wnorm(assistQueryFromInput().trim()));
        } else if (e.key === 'ArrowDown') {
            assistRefresh();
        }
        return;
    }
    if (e.key === 'Enter' && open && assist.active >= 0) {
        e.preventDefault();
        e.stopPropagation();
        assistApply(assist.active);
        return;
    }
    if (e.key === 'Escape' && open) {
        e.preventDefault();
        e.stopPropagation();
        assistClose();
    }
}

function assistApply(i) {
    const it = assist.items[i];
    if (!it) return;

    if (assist.mode === 'append') {
        const raw = assist.input.value || '';
        const idx = raw.lastIndexOf(',');
        const before = idx >= 0 ? raw.slice(0, idx + 1) + ' ' : '';
        assist.input.value = before + WORD_DISPLAY.get(it.key) + ', ';
        assist.input.focus();
        assistClose();
        // Re-run the assistant on the new text after the comma
        assist.input.dispatchEvent(new Event('input', { bubbles: true }));
        return;
    }

    assist.input.value = WORD_DISPLAY.get(it.key);
    assistClose();
    if (assist.autoApply) {
        assist.autoApply = false;
        settleModal(assist.input.value);
    } else {
        assist.input.focus();
    }
}



/* ---- assisted prompt wrapper (no changes needed inside showModal) ---- */
async function uiPromptWord(message, defaultValue = '', opts = {}) {
    assistOn(
        opts.ignoreIndex === undefined ? -1 : opts.ignoreIndex,
        opts.assistMode || 'replace'
    );
    try { return await uiPrompt(message, defaultValue, opts); }
    finally { assistOff(); }
}




/* ============================================================
   BOARD STATE
   ============================================================ */

const COLORS = ['red','blue','black','white'];
let currentRotation = 0;
let isFlipped = false;
let thinkCounter = 1;

let keyAssistActive = false;

const outerRingIndices = [0,1,2,3,4,9,14,19,24,23,22,21,20,15,10,5];
const innerRingIndices = [6,7,8,13,18,17,16,11];

const degToCompass = {0:'N', 90:'E', 180:'S', 270:'W'};
const compassToDeg = {N:0, E:90, S:180, W:270};

const colorToCode = {red:'R', blue:'B', black:'D', white:'W'};
const codeToColor = {R:'red', B:'blue', D:'black', W:'white'};

const getColor    = cell => COLORS.find(c => cell.classList.contains(c)) || 'white';
const getText     = cell => cell.querySelector('.cell-text').textContent;
const isPlaceholder = (txt, i) => txt.trim() === '' || txt.trim() === 'Card ' + (i + 1);

/* ========== BOARD HISTORY (undo / redo) ========== */
const HISTORY_MAX = 125;
let boardHistory = [];          // array of snapshots
let historyIndex = -1;          // points at the current state
let historyLocked = false;      // set true while restoring so we don’t re-record

function getBoardSnapshot() {
    // Intentionally ignores “think” marks – they are temporary spymaster UI
    const cellsData = Array.from(board.getElementsByClassName('cell')).map(cell => ({
        text: getText(cell),
        colorClass: getColor(cell),
        isPlayFlipped: cell.classList.contains('play-active')
    }));
    return {
        currentRotation,
        isFlipped,
        cellsData: JSON.parse(JSON.stringify(cellsData))   // deep copy
    };
}

function snapshotsEqual(a, b) {
    if (!a || !b) return false;
    if (a.currentRotation !== b.currentRotation || a.isFlipped !== b.isFlipped) return false;
    if (a.cellsData.length !== b.cellsData.length) return false;
    for (let i = 0; i < a.cellsData.length; i++) {
        const x = a.cellsData[i], y = b.cellsData[i];
        if (x.text !== y.text || x.colorClass !== y.colorClass || x.isPlayFlipped !== y.isPlayFlipped)
            return false;
    }
    return true;
}

function pushHistory() {
    if (historyLocked) return;

    let snap = getBoardSnapshot();

    // NHS with a personal rotation: store root orientation only
    const rot = (typeof window.getLocalBoardRotation === 'function')
      ? window.getLocalBoardRotation()
      : 0;
    if (rot && typeof window.rotateCellsArray === 'function' && snap.cellsData) {
      snap = {
        ...snap,
        cellsData: window.rotateCellsArray(snap.cellsData, -rot)
      };
    }

    // Don’t record identical consecutive states
    if (historyIndex >= 0 && snapshotsEqual(boardHistory[historyIndex], snap)) return;

    // Throw away any “future” states (user went back and then made a new change)
    boardHistory = boardHistory.slice(0, historyIndex + 1);

    boardHistory.push(snap);
    if (boardHistory.length > HISTORY_MAX) {
        boardHistory.shift();
    } else {
        historyIndex++;
    }

    updateHistoryButtons();
}

function restoreFromHistory(idx) {
    if (idx < 0 || idx >= boardHistory.length) return;

    historyLocked = true;
    const snap = boardHistory[idx];

    currentRotation = snap.currentRotation;
    isFlipped = snap.isFlipped;
    board.classList.toggle('flipped', isFlipped);

    // Rebuild the board without any think marks
    let cellsData = snap.cellsData.map(c => ({
        text: c.text,
        colorClass: c.colorClass,
        isPlayFlipped: c.isPlayFlipped,
        isThink: false,
        seq: 0
    }));

    // NHS: show history in their current personal rotation
    const rot = (typeof window.getLocalBoardRotation === 'function')
      ? window.getLocalBoardRotation()
      : 0;
    if (rot && typeof window.rotateCellsArray === 'function') {
      cellsData = window.rotateCellsArray(cellsData, rot);
    }

    thinkCounter = 1;
    initBoard(cellsData);

    historyIndex = idx;
    historyLocked = false;
    updateHistoryButtons();
    updateStats();
    // also keep the normal localStorage state in sync
    saveCurrentState();
}

function undoBoard() {
    if (historyIndex > 0) restoreFromHistory(historyIndex - 1);
}

function redoBoard() {
    if (historyIndex < boardHistory.length - 1) restoreFromHistory(historyIndex + 1);
}

function updateHistoryButtons() {
    const undoBtn = document.getElementById('btn-undo');
    const redoBtn = document.getElementById('btn-redo');
    if (undoBtn) undoBtn.disabled = historyIndex <= 0;
    if (redoBtn) redoBtn.disabled = historyIndex >= boardHistory.length - 1;
}

	
/* ---------- persistence ---------- */
function loadSavedState() {
    const savedData = localStorage.getItem('wordBoardState');
    if (savedData) {
        try {
            const parsed = JSON.parse(savedData);
            currentRotation = parsed.currentRotation || 0;
            isFlipped = !!parsed.isFlipped;
            if (isFlipped) board.classList.add('flipped');
            thinkCounter = 1 + parsed.cellsData.reduce((m, c) => Math.max(m, c.seq || 0), 0);
            initBoard(parsed.cellsData);
            return;
        } catch (e) { console.error('Error pulling local layout data configurations', e); }
    }
    initBoard(Array.from({length:25}, (_, i) => ({ text:`Card ${i+1}`, colorClass:'white', isPlayFlipped:false })));
}

function saveCurrentState() {
    const cellsData = Array.from(board.getElementsByClassName('cell')).map(cell => ({
        text: getText(cell),
        colorClass: getColor(cell),
        isPlayFlipped: cell.classList.contains('play-active'),
        isThink: cell.classList.contains('think'),
        seq: +cell.dataset.seq || 0
    }));
    localStorage.setItem('wordBoardState', JSON.stringify({ currentRotation, isFlipped, cellsData }));

    pushHistory();

    if (typeof pushLiveBoard === 'function') pushLiveBoard();
}

function initBoard(cellsData) {
    board.innerHTML = '';
    cellsData.forEach((cellData, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.classList.add(cellData.colorClass || 'white');
        if (cellData.isPlayFlipped) cell.classList.add('play-active');
        if (cellData.isThink) { cell.classList.add('think'); cell.dataset.seq = cellData.seq || thinkCounter++; }
        cell.dataset.index = i;

        const textSpan = document.createElement('span');
        textSpan.className = 'cell-text';
        textSpan.textContent = cellData.text;
        textSpan.style.transform = `rotate(${currentRotation}deg)`;

        cell.appendChild(textSpan);
        cell.addEventListener('click', () => handleCellClick(cell));
        board.appendChild(cell);
    });
    handleModeChange();
    updateStats();
}

/* ========== KEYBOARD SHORTCUTS FOR HISTORY ========== */
document.addEventListener('keydown', e => {
    // Ignore when typing in an input/textarea/modal
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) {
        return;
    }

    if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z' || e.key === 'Z') {
            e.preventDefault();
            undoBoard();
        }
        if (e.key === 'y' || e.key === 'Y') {
            e.preventDefault();
            redoBoard();
        }
    }
});

/* ============================================================
   INTERACTION
   ============================================================ */
async function handleCellClick(cell) {
    const mode = document.getElementById('mode-select').value;
	
    if (mode === 'keyassist') { keyCellClick(cell); return; }
    if (mode === 'spymaster') {
        const action = document.getElementById('spy-action').value;
        if (action === 'flip') {
            const nowRevealed = !cell.classList.contains('play-active');
            cell.classList.toggle('play-active', nowRevealed);
            if (nowRevealed) unthink(cell);
        } else {
            toggleThink(cell);
        }
        updateStats(); saveCurrentState();

    } else if (mode === 'player') {
        const word = getText(cell) || 'this card';
        const choice = await showModal({
            title: 'Reveal card',
            message: `“${word}” — which colour was it?`,
            dismiss: null,
            buttons: [
                {label:'Red',   value:'red',   swatch:'red'},
                {label:'Blue',  value:'blue',  swatch:'blue'},
                {label:'White', value:'white', swatch:'white'},
                {label:'Black', value:'black', swatch:'black'},
                {label:'Cancel', value:null}
            ]
        });
        if (!choice) return;
        paintCell(cell, choice, true);          // colour it AND select/reveal it
        updateStats(); saveCurrentState();

    } else if (mode === 'color') {
        paintCell(cell, document.getElementById('color-select').value, false);
        updateStats(); saveCurrentState();

    } else if (mode === 'text') {
        const idx = parseInt(cell.dataset.index);
        const newText = await uiPromptWord(`Text for cell ${idx + 1}:`, getText(cell),
                                   { title: 'Edit card', ignoreIndex: idx });
        if (newText !== null && newText.trim() !== '') {
            cell.querySelector('.cell-text').textContent = newText.trim();
            updateStats(); saveCurrentState();
        }
    }
}

function paintCell(cell, color, reveal) {
    unthink(cell);
    cell.classList.remove(...COLORS, 'play-active');
    cell.classList.add(color);
    if (reveal) cell.classList.add('play-active');
}

function toggleThink(cell) {
    if (cell.classList.contains('think')) unthink(cell);
    else { cell.classList.add('think'); cell.dataset.seq = thinkCounter++; }
}
function unthink(cell) { cell.classList.remove('think'); delete cell.dataset.seq; }

function clearThoughts() {
    Array.from(board.getElementsByClassName('cell')).forEach(unthink);
    thinkCounter = 1;
    updateStats(); saveCurrentState();
}

function handleModeChange() {
    const sel = document.getElementById('mode-select');
    if (!sel) return;
    const mode = sel.value;

    const kp = document.getElementById('key-panel');
    if (kp) kp.classList.toggle('open', mode === 'keyassist');
    if (mode === 'keyassist') keyEnter();      // initialises Key Assist

    updateStats();
}

/* ============================================================
   FLIP / ROTATE
   ============================================================ */
function toggleCellFlip() {
    rotateWordsClockwise();
    isFlipped = !isFlipped;
    board.classList.toggle('flipped', isFlipped);
    saveCurrentState();
}

function rotateWordsClockwise() {
    currentRotation = (currentRotation + 90) % 360;
    board.querySelectorAll('.cell-text').forEach(w => w.style.transform = `rotate(${currentRotation}deg)`);
    saveCurrentState();
}

function rotateRingClockwise(indexArray, shiftSteps) {
    const cells = board.getElementsByClassName('cell');
    const len = indexArray.length;

    const extracted = indexArray.map(idx => ({
        text: getText(cells[idx]),
        color: getColor(cells[idx]),
        playActive: cells[idx].classList.contains('play-active'),
        think: cells[idx].classList.contains('think'),
        seq: cells[idx].dataset.seq
    }));

    const shifted = new Array(len);
    for (let i = 0; i < len; i++) shifted[(i + shiftSteps) % len] = extracted[i];

    indexArray.forEach((idx, i) => {
        const cell = cells[idx], d = shifted[i];
        cell.querySelector('.cell-text').textContent = d.text;
        cell.className = 'cell';
        cell.classList.add(d.color);
        if (d.playActive) cell.classList.add('play-active');
        if (d.think) { cell.classList.add('think'); cell.dataset.seq = d.seq; } else delete cell.dataset.seq;
    });
}

function rotateBoardOuterRing() {
    rotateRingClockwise(outerRingIndices, 4);
    rotateRingClockwise(innerRingIndices, 2);
    updateStats();
    saveCurrentState();
}

async function importWordsPrompt() {

        '',
        {
            title: 'Import words',
            okLabel: 'Import',

    });

async function addWordPrompt() {
    while (true) {
        const cells = Array.from(board.getElementsByClassName('cell'));
        const target = cells.find((cell, i) => isPlaceholder(getText(cell), i));
        if (!target) { await uiAlert('The board is completely full!', 'No room'); return; }
        const idx = cells.indexOf(target);

        assist.autoApply = true;                 // picking from the dropdown auto-submits

            { title: 'Add word — pick to auto-advance', okLabel: 'Add',
              ignoreIndex: idx });

        saveCurrentState();

}

async function clearBoard(skipConfirm = false) {     
    // 1. Short-circuit the confirmation if skipConfirm is true     
    if (!skipConfirm && !await uiConfirm('Clear every word, colour and selection on the board?', 'Clear board')) return;          
    
    // 2. Reset all cells
    Array.from(board.getElementsByClassName('cell')).forEach((cell, i) => {         
        cell.className = 'cell white';         
        delete cell.dataset.seq;         
        cell.querySelector('.cell-text').textContent = `Card ${i + 1}`;

    currentRotation = 0;

    board.querySelectorAll('.cell-text').forEach(w => w.style.transform = 'rotate(0deg)');     
    board.classList.toggle('flipped', isFlipped);

    await saveCurrentState(); 
}

/* ============================================================
   STATS + CLUE NOTES
   ============================================================ */
function updateStats() {
    let totalRed = 0, totalBlue = 0, selRed = 0, selBlue = 0;

    const cells = Array.from(board.getElementsByClassName('cell'));

    // Revealed counts always come from what is visible / flipped on the DOM
    cells.forEach(cell => {
      const c = getColor(cell);
      const sel = cell.classList.contains('play-active');
      if (c === 'red' && sel) selRed++;
      if (c === 'blue' && sel) selBlue++;
    });

    const inLive = typeof liveRoomId !== 'undefined' && !!liveRoomId;
    const liveTotals = window.lastLiveColorTotals;

    //const cells = Array.from(board.getElementsByClassName('cell'));

    // Numerator = revealed cards of that color
    cells.forEach(cell => {
      const c = getColor(cell);
      const sel = cell.classList.contains('play-active');
      if (c === 'red' && sel) selRed++;
      if (c === 'blue' && sel) selBlue++;
    });

    const inLive = typeof liveRoomId !== 'undefined' && !!liveRoomId;

    if (inLive && typeof window.lastRedHasMore === 'boolean') {
      // Majority team has 9, other has 8
      totalRed  = window.lastRedHasMore ? 9 : 8;
      totalBlue = window.lastRedHasMore ? 8 : 9;
    } else {
      cells.forEach(cell => {
        const c = getColor(cell);
        if (c === 'red') totalRed++;
        if (c === 'blue') totalBlue++;
      });
    }

    const redEl = document.getElementById('red-count');

/* ============================================================
   SECRET UNLOCK / LOCK  (stable version)
   Unlock = tap sequence matching the TOP ROW colors
            (white/black → h3, red → red stat, blue → blue stat)
            + first column must contain both a red and a blue
   Lock   = red → blue → h3
   ============================================================ */
(function () {
  const STORAGE_KEY = 'termkrytCmdUnlocked';
  let buf = [];                     // rolling buffer of recent taps

  // ---------- helpers ----------
  function topRowSeq() {
    const cells = [...document.querySelectorAll('#board .cell')];
    if (cells.length < 5) return [];
    return [0,1,2,3,4].map(i => {
      const c = cells[i];
      if (c.classList.contains('red'))  return 'red';
      if (c.classList.contains('blue')) return 'blue';
      return 'white';               // white or black
    });
  }

  function firstColHasBoth() {
    const cells = [...document.querySelectorAll('#board .cell')];
    if (cells.length < 25) return false;
    const col = [0,5,10,15,20].map(i => cells[i]);
    return col.some(c => c.classList.contains('red')) &&
           col.some(c => c.classList.contains('blue'));
  }

  function isUnlocked() {
    return localStorage.getItem(STORAGE_KEY) === '1';
  }

  function addBtn() {
    if (document.getElementById('cmd-unlock-btn')) return;
    const btn = document.createElement('button');
    btn.id = 'cmd-unlock-btn';
    btn.textContent = 'Enter command';
    btn.style.cssText = 'margin:8px 0 0;padding:8px 14px;font-size:13px;';
    btn.onclick = () => {
      uiPrompt('Enter a command:', '', { title: 'Command palette', okLabel: 'Run' })
        .then(cmd => { if (cmd && cmd.trim()) executeCommand(cmd); });
    };
    document.getElementById('stats-blurb')?.appendChild(btn);
  }

  function removeBtn() {
    document.getElementById('cmd-unlock-btn')?.remove();
  }

  function unlock() {
    localStorage.setItem(STORAGE_KEY, '1');
    addBtn();
    console.log('%cCommand palette unlocked', 'color:#2e7d32;font-weight:bold');
  }

  function lock() {
    localStorage.removeItem(STORAGE_KEY);
    removeBtn();
    console.log('%cCommand palette locked', 'color:#c62828;font-weight:bold');
  }

  // ---------- core logic ----------
  function onTap(kind) {
    buf.push(kind);
    if (buf.length > 5) buf.shift();

    // 1. Lock sequence (length 3) – highest priority
    if (buf.length >= 3) {
      const s = buf.slice(-3).join('');
      if (s === 'redbluewhite') {
        lock();
        buf = [];
        return;
      }
    }

    // 2. Unlock sequence (length 5)
    const needed = topRowSeq();
    if (needed.length === 5 && buf.length >= 5) {
      const got = buf.slice(-5);
      const match = got.every((v, i) => v === needed[i]);
      if (match && firstColHasBoth()) {
        unlock();
      }
      // always clear after a full 5-tap attempt
      buf = [];
    }
  }

  // ---------- wire events (only once each) ----------
  function wire() {
    const h3   = document.querySelector('#stats-blurb h3');
    const red  = document.getElementById('stat-red');
    const blue = document.getElementById('stat-blue');

    if (h3)  h3.addEventListener('click',  () => onTap('white'));
    if (red) red.addEventListener('click',  () => onTap('red'));
    if (blue) blue.addEventListener('click', () => onTap('blue'));

    if (isUnlocked()) addBtn();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wire);
  } else {
    wire();
  }
})();

function escapeHTML(s) {
    return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* ============================================================
   COMPACT EXPORT / IMPORT
   Format:  <shape><orient><25 colour codes>:<word;word;...>
     shape  : W = wide (4:3)   L = tall (3:4)
     orient : N E S W  (word rotation)
     colour : R B D W  — UPPER = hidden, lower = revealed
     words  : ';'-separated; blank = default "Card n"; trailing blanks dropped
   Example: WNWWWWRRRRRBBBBBDWWWWWWWW:apple;pear;kite
   ============================================================ */
function buildDataString(colorblind = false) {
    const cells = Array.from(board.getElementsByClassName('cell'));
    const flags = (isFlipped ? 'L' : 'W') + (degToCompass[currentRotation] || 'N');

    const codes = colorblind
        ? 'W'.repeat(25)                              // blank: all white, unrevealed
        : cells.map(cell => {
            const ch = colorToCode[getColor(cell)] || 'W';
            return cell.classList.contains('play-active') ? ch.toLowerCase() : ch;
        }).join('');

    const words = cells.map((cell, i) => {
        const t = getText(cell).trim();
        return isPlaceholder(t, i) ? '' : t.replace(/;/g, ',');
    });
    while (words.length && words[words.length - 1] === '') words.pop();

    return flags + codes + ':' + words.join(';');
}


function parseAnyFormat(s) {
    if (!s) return null;
    if (s.includes('::'))                 return parseLegacy(s);
    if (s.includes(':'))                  return parseCompact(s);
    if (/^-?[0-9A-Za-z]+$/.test(s))       return decodeBoardToken(s);   // shareboard.js
    return null;
}

}


function parseCompact(s) {
    const cut = s.indexOf(':');
    if (cut < 27) return null;                       // 2 flags + 25 codes
    const flags = s.slice(0, 2);
    const codes = s.slice(2, cut);
    if (codes.length !== 25) return null;

    const words = s.slice(cut + 1).split(';');
    while (words.length < 25) words.push('');

    return {
        isFlipped: flags[0].toUpperCase() === 'L',
        rotation: compassToDeg[flags[1].toUpperCase()] ?? 0,
        cells: Array.from({length:25}, (_, i) => {
            const ch = codes[i];
            const color = codeToColor[ch.toUpperCase()] || 'white';
            const w = (words[i] || '').trim();
            return {
                text: w === '' ? `Card ${i+1}` : w,
                colorClass: color,
                isPlayFlipped: ch === ch.toLowerCase()
            };
        })
    };
}

function parseLegacy(s) {                            // old  WN::word|C|true;;…
    const [flags, body] = s.split('::');
    if (!body || flags.length !== 2) return null;
    const chunks = body.split(';;');
    if (chunks.length !== 25) return null;
    return {
        isFlipped: flags[0] === 'L',
        rotation: compassToDeg[flags[1]] ?? 0,
        cells: chunks.map((chunk, i) => {
            const p = chunk.split('|');
            return {
                text: (p[0] || '').trim() || `Card ${i+1}`,
                colorClass: codeToColor[(p[1] || 'W').toUpperCase()] || 'white',
                isPlayFlipped: p[2] === 'true' || p[2] === '1'
            };
        })
    };
}

function switchPairs() {
    const pair = new Map();
    WORD_PAIRS.forEach(([a, b]) => {
        const n = w => w.toLowerCase().replace(/[^a-z0-9]+/g, '');
        pair.set(n(a), b);
        if (!pair.has(n(b))) pair.set(n(b), a);
    });
    [...board.getElementsByClassName('cell')].forEach((cell, i) => {
        const t = cell.querySelector('.cell-text').textContent.trim();
        if (!t || t === `Card ${i+1}`) return;
        const p = pair.get(t.toLowerCase().replace(/[^a-z0-9]+/g, ''));
        if (p) cell.querySelector('.cell-text').textContent = p;
    });
    updateStats();
    saveCurrentState();
}

function invertColors() {

            cell.classList.add('blue');

/* ===== BOARD TRANSFORM HELPER ===== */
function boardTransform(mapping) {
    const cells = [...board.getElementsByClassName('cell')];
    const data = cells.map(cell => ({
        text: getText(cell),
        color: getColor(cell),
        playActive: cell.classList.contains('play-active'),
        think: cell.classList.contains('think'),
        seq: cell.dataset.seq || 0
    }));
    mapping.forEach((from, i) => {
        const d = data[from];
        const cell = cells[i];
        cell.querySelector('.cell-text').textContent = d.text;
        cell.className = 'cell';
        cell.classList.add(d.color);
        if (d.playActive) cell.classList.add('play-active');
        if (d.think) { cell.classList.add('think'); cell.dataset.seq = d.seq; }
        else delete cell.dataset.seq;
    });
    updateStats();
    saveCurrentState();
}

/* ===== FLIP MAPPINGS ===== */
function flipBoardH() {                     // mirror left-right
    const m = Array.from({length:25}, (_, i) => 5 * Math.floor(i / 5) + (4 - i % 5));
    boardTransform(m);
}

function flipBoardV() {                     // mirror up-down
    const m = Array.from({length:25}, (_, i) => 5 * (4 - Math.floor(i / 5)) + i % 5);
    boardTransform(m);
}

function flipBoardUR() {                    // diagonal up-right (bottom-left to top-right)
    const m = Array.from({length:25}, (_, i) => 24 - Math.floor(i / 5) - 5 * (i % 5));
    boardTransform(m);
}

function flipBoardUL() {                    // diagonal up-left (bottom-right to top-left)
    const m = Array.from({length:25}, (_, i) => 5 * (i % 5) + Math.floor(i / 5));
    boardTransform(m);
}

function shiftUp() {
    boardTransform(Array.from({ length: 25 }, (_, i) => (i + 5) % 25));
}

function shiftDown() {
    boardTransform(Array.from({ length: 25 }, (_, i) => (i + 20) % 25));
}

function shiftRight() {
    boardTransform(Array.from({ length: 25 }, (_, i) => 5 * Math.floor(i / 5) + (i % 5 + 4) % 5));
}

function shiftLeft() {
    boardTransform(Array.from({ length: 25 }, (_, i) => 5 * Math.floor(i / 5) + (i % 5 + 1) % 5));
}

(function () {

  const boardEl = document.getElementById('board');

  }

  function textOf(cell) {
    const span = cell.querySelector('.cell-text');
    return span ? span.textContent : '';
  }

  function setText(cell, value) {
    const span = cell.querySelector('.cell-text');
    if (span) span.textContent = value;
  }

  function makeGhost(cell, x, y) {
    ghost = document.createElement('div');
    ghost.id = 'drag-ghost';
    ghost.textContent = textOf(cell);
    document.body.appendChild(ghost);
    moveGhost(x, y);
  }

  function moveGhost(x, y) {
    if (!ghost) return;
    ghost.style.left = x + 'px';
    ghost.style.top  = y + 'px';
  }

  function cleanup() {
    if (ghost) { ghost.remove(); ghost = null; }
    if (srcCell) srcCell.classList.remove('drag-src');
    if (overCell) overCell.classList.remove('drag-over');
    srcCell = null;
    overCell = null;
    armed = false;
  }

  function onDown(e) {
    if (!dragEnabled) return;
    const point = e.touches ? e.touches[0] : e;
    const cell = cellAt(point.clientX, point.clientY);
    if (!cell) return;
    srcCell = cell;
    startX = point.clientX;
    startY = point.clientY;
    armed = false;
  }

  function onMove(e) {
    if (!dragEnabled || !srcCell) return;
    const point = e.touches ? e.touches[0] : e;

    if (!armed) {
      const dx = point.clientX - startX;
      const dy = point.clientY - startY;
      if (Math.sqrt(dx * dx + dy * dy) < DRAG_THRESHOLD) return;
      armed = true;
      srcCell.classList.add('drag-src');
      makeGhost(srcCell, point.clientX, point.clientY);
    }

    e.preventDefault();
    moveGhost(point.clientX, point.clientY);

    const target = cellAt(point.clientX, point.clientY);
    if (target !== overCell) {
      if (overCell) overCell.classList.remove('drag-over');
      overCell = (target && target !== srcCell) ? target : null;
      if (overCell) overCell.classList.add('drag-over');
    }
  }

  function onUp(e) {
    if (!dragEnabled || !srcCell) { cleanup(); return; }

    if (armed) {
      const point = e.changedTouches ? e.changedTouches[0] : e;
      const target = cellAt(point.clientX, point.clientY);
      if (target && target !== srcCell) {
        const cells = Array.prototype.slice.call(boardEl.querySelectorAll('.cell'));
        const from = cells.indexOf(srcCell);
        const to   = cells.indexOf(target);

        if (from >= 0 && to >= 0) {
          const words = cells.map(textOf);
          const moved = words.splice(from, 1)[0];
          words.splice(to, 0, moved);
          cells.forEach(function (cell, i) { setText(cell, words[i]); });

          if (typeof updateStats === 'function') updateStats();
          if (typeof saveCurrentState === 'function') saveCurrentState();
        }
      }

      // swallow the click that follows a real drag
      const swallow = function (ev) {
        ev.stopPropagation();
        ev.preventDefault();
        boardEl.removeEventListener('click', swallow, true);
      };
      boardEl.addEventListener('click', swallow, true);
    }

    cleanup();
  }

  boardEl.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  boardEl.addEventListener('touchstart', onDown, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onUp);
  document.addEventListener('touchcancel', function () { cleanup(); });
})();
</script>
</body>
</html>

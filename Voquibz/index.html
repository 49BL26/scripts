<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Tester</title>
    <style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
h1 {
    color: #333;
}
.utility-bar {
    width: 100%;
    max-width: 950px;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
}
.toggle-panel-btn {
    background-color: #7f8c8d;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
}
.toggle-panel-btn:hover {
    background-color: #95a5a6;
}
table {
    border-collapse: collapse;
    width: 100%;
    max-width: 950px;
    background: #fff;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    border-radius: 8px;
    overflow: hidden;
}
th, td {
    padding: 12px 15px;
    text-align: left;
    vertical-align: middle;
}
th {
    background-color: #4A90E2;
    color: white;
    text-transform: uppercase;
    font-size: 14px;
}
tr:nth-child(even) {
    background-color: #f9f9f9;
}
input[type="text"] {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
}
input[type="text"]:focus {
    border-color: #4A90E2;
    outline: none;
}
input[type="text"]:disabled {
    background-color: #eaeded;
    color: #7f8c8d;
    cursor: not-allowed;
}
.score-cell {
    width: 300px;
    word-break: break-word;
}
.score-badge {
    display: inline-block;
    padding: 3px 6px;
    margin: 2px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
}
.perfect { background-color: #2ecc71; }
.good { background-color: #f1c40f; color: #333; }
.bad { background-color: #e67e22; }
.terrible { background-color: #e74c3c; }
.hint-text {
    font-size: 12px;
    color: #e74c3c;
    margin-bottom: 4px;
    display: block;
}

    </style>
</head>
<body>

<h1>Vocabulary Tester</h1>
<p>Type the target word and press <strong>Enter</strong> to grade.</p>

<div class="utility-bar">
    <button id="toggle-panel-btn" class="toggle-panel-btn">⚙️ Toggle Input Panel</button>
</div>

<!-- Paste Box Panel -->
<div id="paste-panel" style="width: 100%; max-width: 950px; margin-bottom: 20px; background: #fff; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; box-sizing: border-box; display: none;">

<div style="margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 15px;">
    <label for="language-select" style="font-weight: bold; margin-right: 10px;">Select Preset Language:</label>
    <select id="language-select" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px;">
        <option value="ru.json">Russian (ru.json)</option>
        <option value="by.json">Belarusian (by.json)</option>
    </select>
    <button id="load-preset-btn" style="background-color: #2ecc71; color: white; border: none; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px;">Load Preset</button>
</div>


    <label for="raw-vocab" style="font-weight: bold; display: block; margin-bottom: 5px;">Paste Tab/Newline Separated List:</label>
    <textarea id="raw-vocab" rows="5" style="width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace;" placeholder="Definition [TAB] Word&#10;Definition [TAB] Word"></textarea>
    <button id="load-vocab-btn" style="margin-top: 10px; background-color: #4A90E2; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">Load Custom List</button>
</div>

<table>
    <thead>
        <tr>
            <th>English Definition / Meaning</th>
            <th>Target Language Input</th>
            <th>Score / Correctness Record</th>
        </tr>
    </thead>
    <tbody id="vocab-table-body">
        <!-- Rows injected by JavaScript -->
    </tbody>
</table>

    <script>
const vocabList = [
    { definition: "A piece of furniture with a flat top and one or more legs, used as a surface for working at, eating from or on which to place things.", target: "table" },
    { definition: "A domesticated carnivorous mammal that typically has a long snout, an acute sense of smell, and a barking, howling, or whining voice.", target: "dog" },
    { definition: "A large natural stream of water flowing in a channel to the sea, a lake, or another such stream.", target: "river" },
    { definition: "An institution for educating children.", target: "school" },
    { definition: "A celestial body that generates light and other radiant energy and consists of a mass of gas held together by its own gravity.", target: "star" }
];

let quizState = {}; 
let historyQueue = []; 

const tbody = document.getElementById('vocab-table-body');

document.getElementById('toggle-panel-btn').addEventListener('click', function() {
    const panel = document.getElementById('paste-panel');
    panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
});

function getLevenshteinDistance(a, b) {
    const matrix = [];
    
    // Correctly initialize a 2D matrix grid without overwriting the row arrays
    for (let i = 0; i <= b.length; i++) {
        matrix[i] = new Array(a.length + 1);
        matrix[i][0] = i;
    }
    for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
    }
    
    // Fill out the distance values
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1, // substitution
                    matrix[i][j - 1] + 1,     // insertion
                    matrix[i - 1][j] + 1      // deletion
                );
            }
        }
    }
    return matrix[b.length][a.length];
}


function gradeEntry(input, target) {
    if (!target) return 0.00;
    const cleanInput = input.trim().toLowerCase();
    const cleanTarget = target.trim().toLowerCase();

    if (cleanTarget === "") return 0.00;
    if (cleanInput === cleanTarget) return 1.00;
    if (cleanInput === "") return 0.00;

    const distance = getLevenshteinDistance(cleanInput, cleanTarget);
    const targetLength = cleanTarget.length;
    let score = 1 - (distance / targetLength);

    if (cleanInput.length > targetLength) {
        const extraLetters = cleanInput.length - targetLength;
        score -= (extraLetters / targetLength);
    }
    return isNaN(score) ? 0.00 : parseFloat(score.toFixed(2));
}

function getScoreClass(score) {
    if (score === 1) return 'perfect';
    if (score >= 0.7) return 'good';
    if (score >= 0.0) return 'bad';
    return 'terrible';
}

function focusNextInput(currentIndex, totalCount) {
    // Looks for the next sequential input field that isn't disabled
    for (let i = 1; i <= totalCount; i++) {
        const targetIndex = (currentIndex + i) % totalCount;
        const nextInput = document.getElementById(`input-field-${targetIndex}`);
        if (nextInput && !nextInput.disabled) {
            nextInput.focus();
            break;
        }
    }
}

function appendScoreBadge(containerId, score) {
    const container = document.getElementById(containerId);
    const badge = document.createElement('span');
    badge.className = `score-badge ${getScoreClass(score)}`;
    badge.textContent = (score * 100).toFixed(0) + "%";
    container.appendChild(badge);
}

function renderTable(list) {
    tbody.innerHTML = ''; 
    quizState = {}; 
    historyQueue = []; 
    
    list.forEach((item, index) => {
        quizState[index] = { 
            attempts: [], 
            finished: false, 
            hasHintActive: false,
            hintClearedAtCount: null 
        };

        const tr = document.createElement('tr');

        const tdDef = document.createElement('td');
        tdDef.textContent = item.definition;
        tr.appendChild(tdDef);

        const tdInput = document.createElement('td');
        const hintContainer = document.createElement('div');
        hintContainer.id = `hint-container-${index}`;
        
        const input = document.createElement('input');
        input.type = 'text';
        input.id = `input-field-${index}`;
        input.placeholder = 'Type answer...';
        
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const userValue = this.value.trim();
                const currentHint = document.getElementById(`hint-container-${index}`);
                
                if (!historyQueue.includes(index)) {
                    historyQueue.push(index);
                }

                // CASE A: User is working through a visible typo correction block
                if (quizState[index].hasHintActive) {
                    if (userValue.toLowerCase() === item.target.trim().toLowerCase()) {
                        quizState[index].hasHintActive = false;
                        quizState[index].hintClearedAtCount = historyQueue.length; 
                        
                        currentHint.innerHTML = ''; 
                        this.value = ''; 
                        
                        // Shift focus immediately upon successful hint correction
                        focusNextInput(index, list.length);
                    }
                    return; 
                }

                // CASE B: Standard memory extraction run (No hint is currently on-screen)
                const score = gradeEntry(userValue, item.target);
                quizState[index].attempts.push(score);
                appendScoreBadge(`score-container-${index}`, score);

                // Calculate the true running collective sum of ALL historical attempts
                let collectiveScoreSum = 0;
                for (let m = 0; m < quizState[index].attempts.length; m++) {
                    collectiveScoreSum += quizState[index].attempts[m];
                }

                // A row is ONLY completed if the absolute final answer is a 100% match 
                // AND the collective accumulated score of all historical errors is >= 1.00 (100%)
                if (score === 1.00 && collectiveScoreSum >= 1.00) {
                    
                    // Check spacing lock requirement based on remaining active items
                    if (quizState[index].hintClearedAtCount !== null) {
                        let uncompletedCount = 0;
                        for (let k = 0; k < list.length; k++) {
                            if (!quizState[k].finished) uncompletedCount++;
                        }

                        const requiredGap = Math.min(5, uncompletedCount - 1);
                        const uniqueInterventions = historyQueue.length - quizState[index].hintClearedAtCount;
                        
                        if (requiredGap > 0 && uniqueInterventions <= requiredGap) {
                            alert(`Memory trace too fresh! Complete at least ${requiredGap - uniqueInterventions + 1} more separate entries before verifying this term.`);
                            this.value = '';
                            return;
                        }
                    }

                    quizState[index].finished = true;
                    this.disabled = true; 
                    focusNextInput(index, list.length);
                    checkQuizCompletion(list.length);
                    
                } else if (score === 1.00 && collectiveScoreSum < 1.00) {
                    // CRITICAL: They typed it perfectly from memory, but their running debt is still negative!
                    quizState[index].finished = false;
                    
                    // Trigger a temporary visual message warning them they are working off debt
                    const remainingDebtPercent = ((1.00 - collectiveScoreSum) * 100).toFixed(0);
                    alert(`Correct translation from memory, but your running history is still penalized. You must type it correctly from memory ${Math.ceil(1.00 - collectiveScoreSum)} more times to offset the previous typo.`);
                    
                    this.value = '';
                    focusNextInput(index, list.length);
                    
                } else {
                    // Trigger dynamic layout penalty rules due to a fresh incorrect attempt
                    quizState[index].finished = false;
                    quizState[index].hasHintActive = true;
                    currentHint.innerHTML = `<span class="hint-text">Correction required: <strong>${item.target}</strong></span>`;
                }

            }
        });
        
        tdInput.appendChild(hintContainer);
        tdInput.appendChild(input);
        tr.appendChild(tdInput);

        const tdScore = document.createElement('td');
        tdScore.id = `score-container-${index}`;
        tdScore.className = 'score-cell';
        tr.appendChild(tdScore);

        tbody.appendChild(tr);
    });

    const oldBanner = document.getElementById('finish-banner');
    if (oldBanner) oldBanner.remove();
}

function checkQuizCompletion(totalItems) {
    let allCompleted = true;
    for (let i = 0; i < totalItems; i++) {
        if (!quizState[i].finished) {
            allCompleted = false;
            break;
        }
    }

    if (allCompleted) {
        const oldBanner = document.getElementById('finish-banner');
        if (oldBanner) oldBanner.remove();

        const banner = document.createElement('div');
        banner.id = 'finish-banner';
        banner.style = "margin-top: 20px; background-color: #2ecc71; color: white; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; width: 100%; max-width: 950px; box-sizing: border-box;";
        
        let totalAttemptsCount = 0;
        for (let i = 0; i < totalItems; i++) {
            totalAttemptsCount += quizState[i].attempts.length;
        }
        
        banner.innerHTML = `🎉 Quiz Done! All items solved from memory with a final 100% match. Total graded attempts: ${totalAttemptsCount}`;
        document.body.appendChild(banner);
    }
}

document.getElementById('load-vocab-btn').addEventListener('click', function() {
    const rawText = document.getElementById('raw-vocab').value;
    if (!rawText.trim()) {
        alert('Please paste some vocabulary data first!');
        return;
    }

    const customList = [];
    const lines = rawText.split(/\r?\n/);

    for (const line of lines) {
        const parts = line.split('\t');
        if (parts.length >= 2) {
            const definition = parts[0].trim();
            const target = parts[1].trim();
            if (definition && target) {
                customList.push({ definition, target });
            }
        }
    }

    if (customList.length === 0) {
        alert('Could not find valid data. Make sure definitions and words are separated by a TAB on each line.');
        return;
    }

    renderTable(customList);
    document.getElementById('paste-panel').style.display = 'none';
});

// Initial load
renderTable(vocabList);

// Compact Preset Array Loader Engine
document.getElementById('load-preset-btn').addEventListener('click', function() {
    const jsonFile = document.getElementById('language-select').value;
    
    fetch(jsonFile)
        .then(response => {
            if (!response.ok) {
                throw new Error(`Could not find or read file: ${jsonFile}`);
            }
            return response.json();
        })
        .then(data => {
            if (!Array.isArray(data) || data.length === 0) {
                alert("Error: JSON must be a non-empty array of terms!");
                return;
            }
            
            // Map the simple two-element array format into the quiz runtime structure
            const optimizedList = data.map(item => {
                return {
                    definition: item[0],
                    target: item[1]
                };
            });
            
            renderTable(optimizedList);
            document.getElementById('paste-panel').style.display = 'none';
        })
        .catch(error => {
            console.error(error);
            alert(`Failed to load preset list. Make sure '${jsonFile}' is in the exact same folder layout as this HTML file.`);
        });
});

    </script>
</body>
</html>

        /* Modern Reset & Warm Cozy Theme */
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Container Card */
        .game-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        /* Top Dropdown Menu */
        .select-wrapper {
            margin-bottom: 24px;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            background-color: #fff;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Big Character Display Box */
        .character-display {
            background-color: #f1f5f9;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
        }

        /* Large Character Input (Gr) */
        #Gr {
            background: transparent;
            border: none;
            font-family: 'Times New Roman', Times, serif;
            font-size: 8rem;
            font-weight: bold;
            color: #1e293b;
            text-align: center;
            width: 100%;
            outline: none;
            pointer-events: none; /* Keeps focus off this read-only field */
        }

        /* Input Grid Area */
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        /* Text Input & Textarea */
        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        textarea {
            height: 54px;
            resize: none;
            font-size: 0.95rem;
            color: #64748b;
        }

        /* Action Buttons Grid */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Styled Buttons */
        input[type="button"] {
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        /* Primary Submit Button */
        input[type="button"][value="Submit"] {
            grid-column: span 2;
            background-color: #6366f1;
            color: white;
        }

        input[type="button"][value="Submit"]:hover {
            background-color: #4f46e5;
        }

        /* Secondary Utility Buttons */
        input[type="button"]:not([value="Submit"]) {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        input[type="button"]:not([value="Submit"]):hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

function Roll(n)
{
J=Math.floor(Math.random()*Number(n));
if(J==0){J=n;}
return J;

}

function LETTERATE()
{
En.value="";
Gr.style.font=Font[Roll(5)-1];
for (j = 0; j < 1; j--){

{

}
if(c==2)
{
Gr.value=alphabet[d-1];
}
if(chance[d-1]<Number(Roll(5))){j=2;}
if(Number(Roll(100))==100){j=2;}
}
En.focus();
}

{

{

}
En.focus();
}

{
